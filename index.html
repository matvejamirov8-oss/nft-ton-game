<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TON NFT Market 🎁</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="logo">💎</span>
      <div>
        <div class="title">TON NFT Маркет</div>
        <div class="sub" id="levelLine">Новичок рынка</div>
      </div>
    </div>
    <div class="wallet">
      <button id="bonusBtn" title="Бонус">🎁<span id="bonusTimer"></span></button>
      <div class="balance"><span id="tonValue">0</span> <b>TON</b></div>
    </div>
  </header>

  <div class="trend-bar">
    <span>Тренд рынка:</span>
    <span id="trendValue">—</span>
    <span class="dot">•</span>
    <span id="invValue">Инвентарь: 0 TON</span>
  </div>

  <main id="view"></main>

  <nav id="tabs">
    <button class="tab active" data-tab="market">🛒<i>Маркет</i><b class="badge hidden" id="badge-market"></b></button>
    <button class="tab" data-tab="gifts">🎁<i>Подарки</i><b class="badge hidden" id="badge-gifts"></b></button>
    <button class="tab" data-tab="sales">🏷<i>Продажи</i><b class="badge hidden" id="badge-sales"></b></button>
    <button class="tab" data-tab="chats">💬<i>Чаты</i><b class="badge hidden" id="badge-chats"></b></button>
    <button class="tab" data-tab="inv">🎒<i>Мои</i><b class="badge hidden" id="badge-inv"></b></button>
  </nav>

  <div id="chatModal" class="modal hidden">
    <div class="chat-box">
      <div class="chat-head">
        <button id="chatClose">‹ Назад</button>
        <div class="chat-who">
          <span id="chatAvatar">🐱</span>
          <div>
            <div id="chatName">Чат</div>
            <div id="chatStatus">печатает…</div>
          </div>
        </div>
        <div id="chatHint"></div>
      </div>
      <div class="chat-body" id="chatBody"></div>
      <div class="chat-actions" id="chatActions"></div>
      <div class="chat-input">
        <input id="chatInput" type="text" placeholder="Сообщение или сумма в TON…" maxlength="120">
        <button id="chatSend">➤</button>
      </div>
    </div>
  </div>

  <div id="toasts"></div>
</div>
<script src="app.js"></script>
</body>
</html>
